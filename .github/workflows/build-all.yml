name: build-all

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.json

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          echo "matrix=$(jq -c '{include: [.[] | {app, upstream, image, ref, dockerfile, version: (.version // "")}]}' images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      app: ${{ matrix.app }}
      upstream: ${{ matrix.upstream }}
      image: ${{ matrix.image }}
      ref: ${{ matrix.ref }}
      version: ${{ matrix.version }}
      dockerfile: ${{ matrix.dockerfile }}
