name: forage

on:
  schedule:
    - cron: "47 4 * * 1"   # Mondays 04:47 UTC — light sha-check (no upstream releases/tags)
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      app: forage
      upstream: aldemaroc/forage
      # platforms: linux/amd64,linux/arm64   # uncomment for multi-arch (extra CI minutes)
